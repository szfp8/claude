name: Verify Repository

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm

      - name: Node diagnostics
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Deployment readiness
        run: npm run doctor

      - name: Repository integrity
        run: npm run verify

      - name: Type check
        run: npm run typecheck

      - name: Static checks
        run: |
          npm run check:deployment
          npm run check:migrations
          npm run check:whitelabel
          npm run check:contact-fields

      - name: Unit tests
        run: npm test
