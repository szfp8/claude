name: Verify Repository

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: npm run validate:complete
