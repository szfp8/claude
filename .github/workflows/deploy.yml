name: Validate Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Node diagnostics
        run: |
          node --version
          npm --version

      - name: Validate scripts
        run: |
          shopt -s nullglob
          for f in scripts/*.mjs; do
            echo "check $f"
            node --check "$f"
          done

      - name: Deployment readiness
        run: npm run doctor

      - name: Repository integrity
        run: npm run verify

      - name: Route and publication checks
        run: |
          npm run check:routes
          npm run check:public
          npm run check:seo-geo
          npm run check:whitelabel
          npm run check:contact-fields

      - name: Reject GET admin mutations
        run: |
          if grep -nE 'href=["'\''"][^"\'']*/admin/[^"\'']*(delete|rescore|generate|read|content/delete)' src/templates/admin.ts; then
            echo "Found a mutation-style admin href; use a POST form instead."
            exit 1
          fi
          if grep -nE 'form method=["'\'']get["'\''][^>]+action=["'\''][^"\'']*/admin/[^"\'']*(delete|rescore|generate|read|content/delete)' src/templates/admin.ts; then
            echo "Found a GET admin mutation form; use POST instead."
            exit 1
          fi

      - name: Cloudflare configuration
        run: |
          npm run check:deployment
          npm run check:migrations

      - name: Type check and tests
        run: |
          npm run typecheck
          npm test

      - name: D1 local migration dry run
        run: npx wrangler d1 migrations apply DB --local

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config wrangler.toml
