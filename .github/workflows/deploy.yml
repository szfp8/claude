name: Validate Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate scripts
        run: |
          shopt -s nullglob
          found=0
          for f in scripts/*.mjs; do
            found=1
            echo "check $f"
            node --check "$f"
          done
          if [ "$found" -eq 0 ]; then
            echo "No .mjs scripts found; skipping script syntax checks."
          fi

      - name: Admin route snapshot
        run: npm run check:routes

      - name: Public route and link completeness
        run: npm run check:public

      - name: SEO/GEO publication contract
        run: npm run check:seo-geo

      - name: White-label baseline
        run: npm run check:whitelabel

      - name: Reject GET admin mutation links
        run: |
          if grep -nE 'href=["'\''"][^"'\''"]*/admin/[^"'\''"]*(delete|rescore|generate|read|content/delete)' src/templates/admin.ts; then
            echo "Found a mutation-style admin href; use a POST form instead."
            exit 1
          fi
          if grep -nE 'form method=["'\''"]get["'\''"][^>]+action=["'\''"][^"'\''"]*/admin/[^"'\''"]*(delete|rescore|generate|read|content/delete)' src/templates/admin.ts; then
            echo "Found a GET admin mutation form; use POST instead."
            exit 1
          fi
          bad="$(grep -nE 'href=["'\''"][^"'\''"]*/admin/subprojects/[^"'\''"]*["'\''"]' src/templates/admin.ts | grep -v '/edit' | grep -v '/new' || true)"
          if [ -n "$bad" ]; then
            echo "Found a direct admin subproject link that is not an edit/create page:"
            echo "$bad"
            exit 1
          fi

      - name: Cloudflare deployment configuration
        run: npm run check:deployment

      - name: D1 migration naming
        run: npm run check:migrations

      - name: Contact Channels legacy field guard
        run: npm run check:contact-fields

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: D1 migration dry run (local)
        run: npx wrangler d1 migrations apply DB --local

      - name: Wrangler configuration dry run
        run: npx wrangler deploy --dry-run --config wrangler.toml

      - name: Package complete source snapshot
        run: |
          zip -r "claude-complete-${GITHUB_SHA}.zip" . \
            -x '.git/*' 'node_modules/*'

      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: claude-complete-${{ github.sha }}
          path: claude-complete-${{ github.sha }}.zip
          retention-days: 14
