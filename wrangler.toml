keep_vars = true

# 白标模板不绑定客户名称。
# Cloudflare Workers Builds 会注入实际 Worker 名称。
# deploy-all.mjs 负责检查并连接当前环境资源。
name = "white-label-cms"
main = "src/index.ts"
compatibility_date = "2026-09-29"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[cache]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"

# D1 binding is stable. database_name is intentionally not hardcoded.
# Each Cloudflare account gets its own provisioned D1 resource.
[[d1_databases]]
binding = "DB"
migrations_dir = "migrations"
migrations_pattern = "migrations/*.sql"

[[kv_namespaces]]
binding = "CACHE_KV"

[[r2_buckets]]
binding = "R2_MEDIA"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

# Runtime vars and secrets are configured in Cloudflare/GitHub.
