keep_vars = true

# Template defaults are safe to customize during Deploy to Cloudflare.
# Never commit account-specific resource IDs.
name = "white-label-cms"
main = "src/index.ts"
compatibility_date = "2026-09-29"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[cache]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "white-label-cms-db"
migrations_dir = "migrations"
migrations_pattern = "migrations/*.sql"

[[kv_namespaces]]
binding = "CACHE_KV"

[[r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "white-label-cms-r2-media"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

# Runtime vars and secrets are configured in Cloudflare/GitHub.
